services:
  portfolio-svelte-web:
    image: portfolio/portfolio-svelte-web
    container_name: portfolio-svelte-web
    restart: always
    build:
      context: .
      # Build-time only. Compose substitutes these from `.env` in this directory
      # (use `docker compose --env-file .env.local ...` to source them
      # elsewhere). PUBLIC_* is baked into the client bundle and the prerendered
      # HTML, so changing it requires `docker compose build`, not a restart.
      #
      # STRAPI_API_KEY is a build arg because every page is prerendered from
      # Strapi during the build. It is NOT needed at runtime.
      args:
        PUBLIC_STRAPI_PROD_API_URL: ${PUBLIC_STRAPI_PROD_API_URL:?set it in .env}
        PUBLIC_STRAPI_DEV_API_URL: ${PUBLIC_STRAPI_DEV_API_URL:-http://localhost:1337}
        STRAPI_API_KEY: ${STRAPI_API_KEY:?set it in .env}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # REQUIRED. adapter-node compares this against the Origin header on form
      # POSTs as CSRF protection. Behind a reverse proxy it cannot infer the
      # public URL, so without this every contact-form submission is rejected
      # with "Cross-site POST form submissions are forbidden".
      ORIGIN: https://pranta.dev
    networks:
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.services.portfolio-web.loadbalancer.server.port=3000'

      # --- apex + www ---------------------------------------------------------
      # The `cloudflare` DNS-01 resolver, not `letsencrypt` — HTTP-01 cannot
      # issue a wildcard certificate. tls.domains asks for pranta.dev with a
      # *.pranta.dev SAN, so this one certificate also covers every subdomain
      # served from this box.
      - 'traefik.http.routers.portfolio-web.rule=Host(`pranta.dev`) || Host(`www.pranta.dev`)'
      - 'traefik.http.routers.portfolio-web.entrypoints=websecure'
      - 'traefik.http.routers.portfolio-web.tls.certresolver=cloudflare'
      - 'traefik.http.routers.portfolio-web.tls.domains[0].main=pranta.dev'
      - 'traefik.http.routers.portfolio-web.tls.domains[0].sans=*.pranta.dev'
      - 'traefik.http.routers.portfolio-web.service=portfolio-web'
      - 'traefik.http.routers.portfolio-web.priority=100'

      # No wildcard catch-all router, deliberately.
      #
      # There used to be a HostRegexp(`^.+\.pranta\.dev$$`) router pointing at
      # this container, so every subdomain without a router of its own served
      # the portfolio. That is wrong: a typo, a subdomain that was never set
      # up, or an app whose container is down should not quietly render
      # somebody else's site. It also hid deployment failures — a broken
      # container looked like a working portfolio instead of an error.
      #
      # Traefik now answers 404 for anything unrouted, which is the truth.
      #
      # This costs nothing in certificates: the apex router above already
      # requests pranta.dev with a *.pranta.dev SAN over DNS-01, so the
      # wildcard certificate is issued and renewed exactly as before.

networks:
  proxy:
    external: true
