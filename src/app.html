<!doctype html>
<html lang="en" class="scroll-smooth!">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-icon.png" />

    <!-- Resource hints for better performance -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://pranta.vps.webdock.cloud" />
    <link rel="dns-prefetch" href="https://placehold.co" />

    <!--
      Applies the stored theme before first paint so the page never flashes the
      wrong palette. Ported verbatim from the Next layout's inline script; it
      has to stay inline and synchronous in <head> to beat the first paint.
    -->
    <script>
      try {
        const storageKey = 'theme'
        const stored = window.localStorage.getItem(storageKey)
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)'
        ).matches
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
      } catch (error) {
        // Fail silently – theming will fall back to default.
      }
    </script>

    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="mono dark:text-opacity-90 bg-gray-50 text-gray-950 dark:bg-gray-900 dark:text-gray-50"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
