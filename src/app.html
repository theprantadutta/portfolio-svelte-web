<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#fafaf8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e0f12"
      media="(prefers-color-scheme: dark)"
    />
    <!--
      Browsers and crawlers request /favicon.ico by convention regardless of
      what is declared here, so the file exists and is named explicitly. The
      PNG is listed second and wins in anything modern; the .ico is the floor.
      Generated by scripts/generate-favicon.mjs.
    -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.png"
      type="image/png"
      sizes="512x512"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Pranta Dutta · Notes from shipping"
      href="/blogs/rss.xml"
    />

    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://media2.dev.to" />

    <!--
      Runs before first paint, synchronously, so it has to stay inline.

      1. Theme: the stored choice, else the OS preference, as data-theme on
         <html>, so the page never flashes the wrong palette.
      2. Motion: data-js says JavaScript is running, which is what allows the
         entrance animations to start hidden. data-ready releases them once
         the two webfonts have loaded, so nothing animates against fallback
         metrics and then jumps. The 900ms cap means a slow font never holds
         the page hidden. Without JavaScript neither attribute is set and
         every element simply renders.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches
          root.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          root.dataset.theme = 'light'
        }

        root.dataset.js = ''
        var done = false
        var ready = function () {
          if (done) return
          done = true
          root.dataset.ready = ''
        }
        setTimeout(ready, 900)
        if (!document.fonts || !document.fonts.load) return ready()
        document.addEventListener('DOMContentLoaded', function () {
          Promise.all([
            document.fonts.load('700 1em Geist'),
            document.fonts.load('400 1em "Geist Mono"'),
          ]).then(ready, ready)
        })
      })()
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
